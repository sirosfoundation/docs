<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1162" role="img" aria-labelledby="t d"><title id="t">SIROS Wallet Layers</title><desc id="d">Layering of the SIROS wallet on a user device, in two paths. Path A: native wallet apps built on the SDK sample apps use the SDK orchestration layer fully, which runs OID4VCI and OID4VP flows and talks to the go-wallet-backend engine over WMP. Path B: the Android and iOS wrapper apps host the wallet-frontend web wallet, which runs the flows and talks to the engine itself; the wrapper exposes native capabilities to the page through a JavaScript bridge, backed by the SDK for ISO 18013-5 proximity on Android, plus wrapper-own code that does not use the SDK. Both paths sit on shared SDK capability modules, Rust and UniFFI libraries and the platform layer.</desc><style>text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}.tt{font-size:20px;font-weight:600;letter-spacing:.4px}.h{font-size:12px;font-weight:600;letter-spacing:.3px}.tb{font-size:11.5px;font-weight:600}.tbs{font-size:10.5px;font-weight:600}.ts{font-size:10.5px;fill:#555}.tn{font-size:10.5px;font-style:italic;fill:#555}.tl{font-size:10.5px;font-weight:600}.pill{font-size:11px;font-weight:600;fill:#fff}.halo{paint-order:stroke;stroke:#FAFBFD;stroke-width:4px;stroke-linejoin:round}</style><defs><filter id="shadow" x="-4%" y="-4%" width="108%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.10"/></filter><marker id="mblue" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,7 3,0 6" fill="#1C4587"/></marker><marker id="mgreen" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,7 3,0 6" fill="#198754"/></marker><marker id="morange" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,7 3,0 6" fill="#C75A11"/></marker><marker id="mgrey" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,7 3,0 6" fill="#777777"/></marker><marker id="mteal" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,7 3,0 6" fill="#0B7285"/></marker><marker id="mgdot" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,7 3,0 6" fill="#777777"/></marker><linearGradient id="hdrG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1C4587"/><stop offset="100%" stop-color="#14366B"/></linearGradient></defs><rect width="1020" height="1162" rx="6" fill="#FAFBFD"/>
